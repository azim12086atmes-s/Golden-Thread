name: Original Golden Thread wardrobe regression
on:
  push:
    branches: [birthday/wardrobe-regression]
permissions:
  contents: read
jobs:
  original-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test tools
        timeout-minutes: 4
        run: |
          npm install --prefix "$RUNNER_TEMP/wardrobe-validation" --no-audit --no-fund typescript@5.9.3 three@0.180.0 @types/three@0.180.0 vite@7.1.12 vitest@3.2.4
          ln -s "$RUNNER_TEMP/wardrobe-validation/node_modules" node_modules
      - name: TypeScript contracts
        run: npm run typecheck
      - name: Original tests with one worker
        run: npm test -- --pool=threads --maxWorkers=1 --minWorkers=1 --reporter=dot
