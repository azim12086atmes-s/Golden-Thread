<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Historical monument render</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dceaf5}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';
import { GeoBuilder } from '/src/world/kit.ts';
import { buildLandmark } from '/src/world/architecture.ts';
import { REGION_BY_ID } from '/src/world/regions.ts';
import { Rng } from '/src/core/rng.ts';
const land = new URLSearchParams(location.search).get('land') || 'japan';
const s = REGION_BY_ID[land];
if (!s) throw Error('Unknown land: ' + land);
const scene = new THREE.Scene();
scene.background = new THREE.Color(land === 'aurora' || land === 'skyisles' ? '#d9e4fa' : '#dceaf5');
const g = new GeoBuilder(), glow = new GeoBuilder();
const out = buildLandmark({g, glow, rng:new Rng('landmark-'+land), s});
const solid = new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide});
const light = new THREE.MeshBasicMaterial({vertexColors:true, side:THREE.DoubleSide});
const group = new THREE.Group();
for (const m of [g.buildLeaves(solid), g.build(solid), glow.build(light)]) if (m) group.add(m);
scene.add(group);
const bounds = new THREE.Box3().setFromObject(group);
const center = bounds.getCenter(new THREE.Vector3());
const size = bounds.getSize(new THREE.Vector3());
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1500,1500),new THREE.MeshLambertMaterial({color:s.ground,side:THREE.DoubleSide}));
ground.rotation.x=-Math.PI/2; ground.position.y=-0.16; scene.add(ground);
scene.add(new THREE.HemisphereLight('#ffffff','#8c8278',2.2));
const sun = new THREE.DirectionalLight('#fff4db',2.2); sun.position.set(-80,180,120); scene.add(sun);
const aspect = 1200/800;
const camera = new THREE.PerspectiveCamera(43,aspect,0.1,3000);
let radius = Math.max(size.x/aspect,size.y,size.z)*0.5;
if (land==='egypt') {center.set(0,19,-14);radius=90;}
const dist = Math.max(24,radius/Math.sin(43*Math.PI/360)*1.6);
camera.position.copy(center).add(new THREE.Vector3(dist*0.43,dist*0.34,dist*0.85));
camera.lookAt(center);
const renderer = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1200,800);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.render(scene,camera);
window.__renderReady = {land,height:out.height,parts:group.children.length,bounds:size.toArray()};
</script></body></html>
